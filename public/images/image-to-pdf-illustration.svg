    <path d="M0 2C0 0.895431 0.895431 0 2 0H14L22 8V36C22 37.1046 21.1046 38 20 38H2C0.895431 38 0 37.1046 0 36V2Z" fill="#0F172A" opacity="0.1" transform="translate(1.5, 2)"/>
