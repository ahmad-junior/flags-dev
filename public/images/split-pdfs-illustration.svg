<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Soft Background Container Tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#F8FAFC" />

  <!-- LEFT SPLIT DOCUMENT (Pages 1-2) -->
  <g transform="translate(7, 14)">
    <!-- Shadow -->
    <path d="M0 2C0 0.895431 0.895431 0 2 0H14L20 6V32C20 33.1046 19.1046 34 18 34H2C0.895431 34 0 33.1046 0 32V2Z" fill="#0F172A" opacity="0.06" transform="translate(1, 1.5)"/>
    <!-- Page Body -->
    <path d="M0 2C0 0.895431 0.895431 0 2 0H14L20 6V32C20 33.1046 19.1046 34 18 34H2C0.895431 34 0 33.1046 0 32V2Z" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <path d="M14 0L20 6H15C14.4477 6 14 5.55228 14 5V0Z" fill="#3B82F6"/>
    <!-- Page Lines -->
    <rect x="4" y="10" width="12" height="2" rx="1" fill="#3B82F6"/>
    <rect x="4" y="15" width="12" height="1.5" rx="0.75" fill="#93C5FD"/>
    <rect x="4" y="19" width="9" height="1.5" rx="0.75" fill="#93C5FD"/>
    <rect x="4" y="23" width="12" height="1.5" rx="0.75" fill="#93C5FD"/>
    <!-- Part Label -->
    <rect x="4" y="27" width="7" height="3" rx="1" fill="#EFF6FF"/>
    <circle cx="5.5" cy="28.5" r="1" fill="#2563EB"/>
    <circle cx="8" cy="28.5" r="1" fill="#2563EB"/>
  </g>

  <!-- RIGHT SPLIT DOCUMENT (Pages 3-4) -->
  <g transform="translate(37, 14)">
    <!-- Shadow -->
    <path d="M0 2C0 0.895431 0.895431 0 2 0H14L20 6V32C20 33.1046 19.1046 34 18 34H2C0.895431 34 0 33.1046 0 32V2Z" fill="#0F172A" opacity="0.06" transform="translate(1, 1.5)"/>
    <!-- Page Body -->
    <path d="M0 2C0 0.895431 0.895431 0 2 0H14L20 6V32C20 33.1046 19.1046 34 18 34H2C0.895431 34 0 33.1046 0 32V2Z" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.5"/>
    <path d="M14 0L20 6H15C14.4477 6 14 5.55228 14 5V0Z" fill="#6366F1"/>
