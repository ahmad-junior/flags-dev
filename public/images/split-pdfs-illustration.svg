    <rect x="4" y="10" width="12" height="2" rx="1" fill="#6366F1"/>
    <rect x="4" y="15" width="12" height="1.5" rx="0.75" fill="#A5B4FC"/>
    <rect x="4" y="19" width="9" height="1.5" rx="0.75" fill="#A5B4FC"/>
    <rect x="4" y="23" width="12" height="1.5" rx="0.75" fill="#A5B4FC"/>
