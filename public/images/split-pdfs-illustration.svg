  <!-- SPLIT ACTION CENTER PIECE (Scissors + Diverging Arrows) -->
  <g transform="translate(24, 20)">
    <!-- Left Branching Arrow -->
    <path d="M7 16 C 4 16, 1 18, -3 20" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="2 1.5" stroke-linecap="round"/>
    <!-- Right Branching Arrow -->
    <path d="M9 16 C 12 16, 15 18, 19 20" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="2 1.5" stroke-linecap="round"/>

    <!-- Modern Scissors Icon Center Badge -->
    <circle cx="8" cy="12" r="8" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1"/>
    <path d="M5.5 8.5 L8 12 L11 8.5" stroke="#EF4444" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M5.5 15.5 L8 12 L11 15.5" stroke="#EF4444" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="5" cy="7.5" r="1.2" stroke="#EF4444" stroke-width="1.2" fill="#FFFFFF"/>
    <circle cx="5" cy="16.5" r="1.2" stroke="#EF4444" stroke-width="1.2" fill="#FFFFFF"/>
