<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#0d1322"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Main Hexagon Shell Gradient -->
    <linearGradient id="hexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <!-- Inner Panel Gradient -->
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Cyan to Emerald Stream Gradient (Hashing / Digest) -->
    <linearGradient id="hashStreamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="650" fill="url(#bgGrad)"/>

  <!-- Subtle Background Grid/Network -->
  <g stroke="#334155" stroke-width="0.5" stroke-dasharray="4 8" opacity="0.3">
    <line x1="0" y1="162" x2="800" y2="162"/>
    <line x1="0" y1="325" x2="800" y2="325"/>
    <line x1="0" y1="487" x2="800" y2="487"/>
    <line x1="200" y1="0" x2="200" y2="650"/>
    <line x1="400" y1="0" x2="400" y2="650"/>
    <line x1="600" y1="0" x2="600" y2="650"/>
  </g>

  <!-- Ambient Glow Behind Emblem -->
  <circle cx="400" cy="275" r="180" fill="#3b82f6" opacity="0.18" filter="url(#intenseGlow)"/>

  <!-- MAIN ICON EMBLEM GROUP -->
  <g transform="translate(400, 260)">

    <!-- Outer Hexagon Frame (Glow) -->
    <polygon points="0,-190 165,-95 165,95 0,190 -165,95 -165,-95" fill="none" stroke="url(#hexGrad)" stroke-width="4" opacity="0.4" filter="url(#glow)"/>

    <!-- Outer Hexagon Frame (Sharp) -->
    <polygon points="0,-180 156,-90 156,90 0,180 -156,90 -156,-90" fill="url(#panelGrad)" stroke="url(#hexGrad)" stroke-width="3.5"/>

    <!-- Internal Divider Channels (Core Pipeline Structure) -->
    <g stroke="url(#hexGrad)" stroke-width="2" fill="none" opacity="0.5">
      <path d="M0,-110 L0,-40 L-60,0"/>
      <path d="M0,-110 L0,-40 L60,0"/>
      <path d="M0,40 L0,120"/>
    </g>

    <!-- TOP SECURITY SHIELD ICON -->
    <g transform="translate(0, -135)">
      <path d="M0,-18 L14,-10 L14,4 C14,14 6,21 0,25 C-6,21 -14,14 -14,4 L-14,-10 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
      <!-- Lock Shackle & Body -->
      <path d="M-5,-5 L-5,-9 C-5,-12 -3,-14 0,-14 C3,-14 5,-12 5,-9 L5,-5" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>
      <rect x="-6" y="-5" width="12" height="10" rx="2" fill="#38bdf8"/>
      <circle cx="0" cy="0" r="1.5" fill="#0f172a"/>
    </g>

    <!-- LEFT INPUT SECTION (Text Hash Document Source) -->
    <g transform="translate(-85, -22)">
      <!-- Text Hash Document Card -->
      <rect x="-45" y="-55" width="90" height="110" rx="8" fill="#0b0f19" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow)"/>

      <!-- Folded Corner Effect -->
      <path d="M25,-55 L45,-35 L25,-35 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>

      <!-- HASH Symbol / Text Input Representation -->
      <g transform="translate(0, -5)">
        <text x="0" y="-2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#38bdf8" text-anchor="middle">H</text>
        <text x="0" y="24" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#93c5fd" text-anchor="middle">HASH</text>
      </g>
    </g>

    <!-- CENTRAL CONVERSION STREAM ARROW -->
    <g transform="translate(0, -5)">
      <!-- Pulsing Data Flow Arrow -->
      <rect x="-32" y="-12" width="64" height="24" rx="12" fill="#0f172a" stroke="url(#hashStreamGrad)" stroke-width="2" filter="url(#glow)"/>
      <path d="M-14,0 L14,0 M6,-6 L14,0 L6,6" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- RIGHT OUTPUT SECTION (Cryptographic Hex Digest Stream) -->
    <g transform="translate(85, -22)">
      <!-- Output Digest Document Card -->
      <rect x="-45" y="-55" width="90" height="110" rx="8" fill="#0b0f19" stroke="#10b981" stroke-width="1.5" filter="url(#glow)"/>

      <!-- Folded Corner Effect -->
      <path d="M25,-55 L45,-35 L25,-35 Z" fill="#1e293b" stroke="#10b981" stroke-width="1"/>

      <!-- Hexadecimal Hash Digest Simulation Lines -->
      <g transform="translate(-38, -35)" font-family="Consolas, Monaco, monospace" font-size="8" fill="#34d399">
        <text x="0" y="0">e3b0c44298fc1c1...</text>
        <text x="0" y="12">e3b0c44298fc1c1...</text>
        <text x="0" y="24">e3b0e43896b4340...</text>
        <text x="0" y="36">e3b0c341311326e...</text>
        <text x="0" y="48">d4f920997838486...</text>
        <text x="0" y="60">e3b0c44298fc1c1...</text>
      </g>
    </g>

    <!-- BOTTOM LOCAL BADGE (Client-Side Indicator) -->
    <g transform="translate(0, 138)">
      <path d="M-8,-4 C-4,-8 4,-8 8,-4" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
      <path d="M-4,-1 C-2,-3 2,-3 4,-1" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
      <circle cx="0" cy="3" r="1.5" fill="#38bdf8"/>
    </g>
  </g>

  <!-- TITLE TYPOGRAPHY -->
  <g transform="translate(400, 525)" text-anchor="middle">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="700" fill="#f8fafc" letter-spacing="0.5">
      FlagsDev <tspan fill="#38bdf8" font-weight="400">Text Hashing</tspan>
    </text>
    <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94a3b8" letter-spacing="1">
      LOCAL CRYPTOGRAPHIC DIGEST GENERATOR
    </text>
  </g>
</svg>
