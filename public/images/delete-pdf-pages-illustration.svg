    <path d="M14 0L20 6H15C14.4477 6 14 5.55228 14 5V0Z" fill="#EF4444"/>
    <!-- Page Lines on Removed Page -->
    <rect x="4" y="9" width="11" height="1.5" rx="0.75" fill="#FCA5A5"/>
    <rect x="4" y="13" width="8" height="1.5" rx="0.75" fill="#FCA5A5"/>
  </g>

