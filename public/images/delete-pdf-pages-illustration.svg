    <rect x="5" y="10" width="14" height="2" rx="1" fill="#475569"/>
    <rect x="5" y="15" width="18" height="1.5" rx="0.75" fill="#CBD5E1"/>
    <rect x="5" y="19" width="12" height="1.5" rx="0.75" fill="#CBD5E1"/>
  </g>

  <!-- REMOVED / DELETED PAGE SLIDING OUT -->
