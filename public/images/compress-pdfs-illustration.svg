<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Soft Background Container Tile -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#F8FAFC" />

  <!-- LARGE ORIGINAL DOCUMENT (BEFORE COMPRESSION) -->
  <g transform="translate(6, 12)">
    <!-- Drop Shadow -->
    <path d="M0 2C0 0.895431 0.895431 0 2 0H16L24 8V38C24 39.1046 23.1046 40 22 40H2C0.895431 40 0 39.1046 0 38V2Z" fill="#0F172A" opacity="0.06" transform="translate(1, 1.5)"/>
    <!-- Page Body -->
    <path d="M0 2C0 0.895431 0.895431 0 2 0H16L24 8V38C24 39.1046 23.1046 40 22 40H2C0.895431 40 0 39.1046 0 38V2Z" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
    <path d="M16 0L24 8H17C16.4477 8 16 7.55228 16 7V0Z" fill="#94A3B8"/>
    <!-- Heavy/Unoptimized Page Lines -->
    <rect x="4" y="11" width="14" height="2" rx="1" fill="#64748B"/>
    <rect x="4" y="16" width="16" height="2" rx="1" fill="#CBD5E1"/>
    <rect x="4" y="21" width="12" height="2" rx="1" fill="#CBD5E1"/>
    <rect x="4" y="26" width="16" height="2" rx="1" fill="#CBD5E1"/>
    <rect x="4" y="31" width="10" height="2" rx="1" fill="#CBD5E1"/>
  </g>

  <!-- CENTER COMPRESSION ACTION (SQUEEZE ARROWS & BADGE) -->
  <g transform="translate(24, 20)">
    <!-- Right Compression Arrow -->
    <path d="M1 12 H15" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 1.5"/>
    <path d="M11 8 L15 12 L11 16" stroke="#2563EB" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Compression Clamp / Shrink Badge -->
    <circle cx="8" cy="12" r="7.5" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
    <!-- Down/Up Squeeze Arrows -->
    <path d="M6 9.5 L8 7.5 L10 9.5" stroke="#2563EB" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M6 14.5 L8 16.5 L10 14.5" stroke="#2563EB" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- SMALL COMPRESSED DOCUMENT (AFTER COMPRESSION) -->
  <g transform="translate(40, 20)">
    <!-- Drop Shadow -->
    <path d="M0 2C0 0.895431 0.895431 0 2 0H12L18 6V28C18 29.1046 17.1046 30 16 30H2C0.895431 30 0 29.1046 0 28V2Z" fill="#0F172A" opacity="0.08" transform="translate(1, 1.5)"/>
    <!-- Page Body (Optimized Clean Blue) -->
    <path d="M0 2C0 0.895431 0.895431 0 2 0H12L18 6V28C18 29.1046 17.1046 30 16 30H2C0.895431 30 0 29.1046 0 28V2Z" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    <path d="M12 0L18 6H13C12.4477 6 12 5.55228 12 5V0Z" fill="#2563EB"/>
    <!-- Optimized Lines -->
    <rect x="3.5" y="9" width="10" height="1.8" rx="0.9" fill="#2563EB"/>
    <rect x="3.5" y="13.5" width="11" height="1.5" rx="0.75" fill="#93C5FD"/>
    <rect x="3.5" y="17.5" width="8" height="1.5" rx="0.75" fill="#93C5FD"/>
    <rect x="3.5" y="21.5" width="11" height="1.5" rx="0.75" fill="#93C5FD"/>
    <!-- Reduced Size Check Pill -->
    <rect x="3.5" y="25" width="7" height="2" rx="1" fill="#DBCFE8"/>
  </g>
</svg>
